<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Profile - SurveyFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: #ffffff;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #2563eb;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 35px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .intro {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .note {
      margin-top: 8px;
      font-size: 13px;
      color: #667085;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .loading {
      text-align: center;
      color: #667085;
      padding: 30px;
    }

    @media (max-width: 500px) {
      .container {
        width: 94%;
        margin: 20px auto;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">SurveyFlow</div>
  </div>

  <div class="container">

    <div id="loading" class="loading">
      Checking your account...
    </div>

    <div id="profileCard" class="card" style="display:none;">

      <h1>Complete Your Survey Profile</h1>

      <p class="intro">
        Complete your SurveyFlow profile once. Your profile will be used
        to help match you with eligible surveys from our supported survey
        providers.
      </p>

      <form id="profileForm">

        <label for="dob">Date of birth</label>
        <input
          type="date"
          id="dob"
          required
        >

        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          <option value="prefer_not_to_say">Prefer not to say</option>
        </select>

        <label for="country">Country</label>
        <select id="country" required>
          <option value="">Select country</option>
          <option value="NG">Nigeria</option>
          <option value="GH">Ghana</option>
          <option value="KE">Kenya</option>
          <option value="ZA">South Africa</option>
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
          <option value="OTHER">Other</option>
        </select>

        <label for="state">State / Region</label>
        <input
          type="text"
          id="state"
          placeholder="Enter your state or region"
          required
        >

        <label for="postalCode">Postal code</label>
        <input
          type="text"
          id="postalCode"
          placeholder="Enter your postal code"
        >

        <div class="note">
          Your information is used for survey eligibility and matching.
        </div>

        <button id="saveButton" type="submit">
          Save Profile & View Surveys
        </button>

        <div id="message" class="message"></div>

      </form>

    </div>
  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    /*
      IMPORTANT:
      Replace the values below with the SAME Firebase configuration
      already being used by your SurveyFlow website.
    */

    const firebaseConfig = {
      apiKey: "AIzaSyA0NEph2RV5-r6Nq-WqRPdcZSzVWRDrfnQ",
      authDomain: "surveyflow-c8611.firebaseapp.com",
      projectId: "surveyflow-c8611",
      storageBucket: "surveyflow-c8611.firebasestorage.app",
      messagingSenderId: "968026283456",
      appId: "1:968026283456:web:b0c87b9dd7255f4e16fc25"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    const loading = document.getElementById("loading");
    const profileCard = document.getElementById("profileCard");
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        loading.innerHTML =
          "You must be logged in to complete your survey profile.<br><br>" +
          "<a href='login.html'>Go to Login</a>";
        return;
      }

      try {

        const doc = await db
          .collection("users")
          .doc(user.uid)
          .collection("surveyProfile")
          .doc("profile")
          .get();

        if (doc.exists) {

          const data = doc.data();

          document.getElementById("dob").value =
            data.dob || "";

          document.getElementById("gender").value =
            data.gender || "";

          document.getElementById("country").value =
            data.country || "";

          document.getElementById("state").value =
            data.state || "";

          document.getElementById("postalCode").value =
            data.postalCode || "";
        }

        loading.style.display = "none";
        profileCard.style.display = "block";

      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "Unable to load your profile. Please try again.";
      }
    });


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const user = auth.currentUser;

      if (!user) {
        showMessage(
          "Please log in before saving your survey profile.",
          "error"
        );
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      const profile = {

        dob: document.getElementById("dob").value,

        gender: document.getElementById("gender").value,

        country: document.getElementById("country").value,

        state: document.getElementById("state").value.trim(),

        postalCode:
          document.getElementById("postalCode").value.trim(),

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      };

      try {

        await db
          .collection("users")
          .doc(user.uid)
          .collection("surveyProfile")
          .doc("profile")
          .set(profile, { merge: true });

        showMessage(
          "Profile saved successfully. Opening available surveys...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "surveys.html";
        }, 1000);

      } catch (error) {

        console.error(error);

        showMessage(
          "Unable to save your profile. Please try again.",
          "error"
        );

        saveButton.disabled = false;
        saveButton.textContent =
          "Save Profile & View Surveys";
      }
    });


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;
    }

  </script>

</body>
  </html>
